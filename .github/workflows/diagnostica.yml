name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verifica chiavi push caricate dal processo (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          echo "--- env del processo pm2 ---"; pm2 env 1 2>/dev/null | grep -E "VAPID_SUBJECT|VERIFICA_NUMERO_ATTIVA|SMS_PROVIDER"; pm2 env 1 2>/dev/null | grep -c "VAPID_PUBLIC_KEY"; pm2 env 1 2>/dev/null | grep -c "VAPID_PRIVATE_KEY"; pm2 list 2>/dev/null | grep handmade
          echo "--- ultime righe log dal riavvio ---"; tail -3 ~/.pm2/logs/handmade-club-error.log; echo ...; grep -n "push\]" ~/.pm2/logs/handmade-club-out.log ~/.pm2/logs/handmade-club-error.log 2>/dev/null | tail -3; echo "ultimo avvio:"; grep -n "in ascolto" ~/.pm2/logs/handmade-club-out.log | tail -1
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
