name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Tentativi di rientro di oggi (sola lettura, nessun dato personale)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          sudo -u postgres psql -d handmade_clienti -At -F ' | ' <<'SQL'
          \echo === CODICI CHIESTI OGGI: ora | usato | tentativi | scaduto ===
          SELECT to_char(created_at AT TIME ZONE 'Europe/Rome','HH24:MI:SS'), usato, tentativi, (scade_il < now()) FROM otp_codes WHERE created_at >= '2026-11-19 00:00+01' ORDER BY created_at;
          \echo === CLIENTI RIENTRATI COL CODICE OGGI (sessioni_valide_da di oggi): ora | verificato | creato il ===
          SELECT to_char(sessioni_valide_da AT TIME ZONE 'Europe/Rome','HH24:MI:SS'), telefono_verificato, to_char(created_at AT TIME ZONE 'Europe/Rome','DD/MM') FROM clienti WHERE sessioni_valide_da >= '2026-11-19 00:00+01' ORDER BY 1;
          \echo === FORMATO DEI NUMERI SALVATI ===
          SELECT CASE WHEN telefono LIKE '+39%' THEN '+39...' WHEN telefono LIKE '39%' AND length(telefono) > 11 THEN '39...' WHEN telefono LIKE '+%' THEN 'altro +' ELSE 'senza prefisso' END, COUNT(*) FROM clienti WHERE stato='attivo' GROUP BY 1;
          SQL
          echo "=== LOG: codici generati dall'admin e risposte al rientro (oggi) ==="
          pm2 logs handmade-club --lines 4000 --nostream 2>/dev/null | grep -E "\[accesso\]|verifica-otp|Sessione non pi" | tail -12 | sed -E 's/[0-9]{6,}/######/g'
          L=$(ls /var/log/nginx/*club*access*.log 2>/dev/null | head -1); [ -z "$L" ] && L=/var/log/nginx/access.log
          echo "=== NGINX oggi: richieste di accesso (ora, percorso, codice) ==="
          grep '19/Nov/2026' $L | grep -E 'POST /api/auth/(richiedi-otp|verifica-otp)|POST /api/admin/clienti/[0-9]+/codice-accesso' | awk '{print substr($4,14,8), $7, $9}' | sed -E 's#/clienti/[0-9]+/#/clienti/N/#' | tail -25
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
