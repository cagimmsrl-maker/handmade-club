name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Conteggio iscrizioni (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- clienti totali per stato ---"; Q "select stato, count(*) from clienti group by 1"
          echo "--- registrazioni per giorno (ora di Roma) ---"; Q "select (created_at at time zone 'Europe/Rome')::date as g, count(*) from clienti group by 1 order by 1"
          echo "--- registrazioni per ora dal 28/10 ---"; Q "select to_char(created_at at time zone 'Europe/Rome','DD/MM HH24') as h, count(*) from clienti where created_at >= '2026-10-28 00:00+01' group by 1 order by 1"
          echo "--- verificati / non verificati ---"; Q "select telefono_verificato, count(*) from clienti where stato='attivo' group by 1"
          echo "--- sede di registrazione se esiste ---"; Q "select column_name from information_schema.columns where table_name='clienti' and column_name like '%sede%'"
          echo "--- TGS per sede ---"; Q "select sede_id, stato, count(*) from tgs_sincronizzazioni group by 1,2 order by 1,2"
          echo "--- attesa TGS ---"; Q "select count(*) from clienti c join tessere t on t.cliente_id=c.id and t.stato='attiva' where c.stato='attivo' and not exists (select 1 from tgs_sincronizzazioni s where s.cliente_id=c.id and s.sede_id=3)"
          echo "--- passaggi cassa / scansioni ---"; Q "select (select count(*) from tgs_passaggi), (select count(*) from scansioni), (select count(*) from promozioni_utilizzi)"
          echo "--- promo caricamenti ---"; Q "select promozione_id, count(*) from promozioni_clienti group by 1 order by 1"
          echo "--- accessi /installa e /registrati da nginx (ieri+oggi) ---"; sudo sh -c "cat /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null" | grep club.handmadecafe -c || true; sudo sh -c "cat /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null" | grep -E '"GET /installa' | awk '{print $4}' | cut -c2-12 | sort | uniq -c || true
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
