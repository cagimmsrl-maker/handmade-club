name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato processo e log dopo il riavvio (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          pm2 describe handmade-club 2>/dev/null | grep -E "status|restarts|uptime|created at|script path" 
          echo "--- ultime 25 righe di log (ordine reale) ---"
          pm2 logs handmade-club --lines 25 --nostream --timestamp "HH:mm:ss" 2>/dev/null | grep -vE "^\s*$|\[TAILING\]|last 25 lines" | tail -25
          echo "--- .env: chiavi presenti? ---"; cd /var/www/handmade-club/server && grep -c "^VAPID_PUBLIC_KEY=.\{20,\}" .env; grep -c "^VAPID_PRIVATE_KEY=.\{20,\}" .env; grep "^VERIFICA_NUMERO_ATTIVA" .env
          echo "--- il processo le vede? (stesso caricamento dotenv dell'app) ---"; node -e "require('dotenv').config(); console.log('pub', (process.env.VAPID_PUBLIC_KEY||'').length, 'priv', (process.env.VAPID_PRIVATE_KEY||'').length, 'verifica', process.env.VERIFICA_NUMERO_ATTIVA)"
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
