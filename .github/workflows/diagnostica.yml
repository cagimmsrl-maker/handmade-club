name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Imposta offerta di benvenuto e invito notifiche nel .env (con backup) e riavvia
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          cd /var/www/handmade-club/server
          cp .env ".env.bak-$(date +%Y%m%d-%H%M%S)"
          python3 - <<'PY'
          import re
          p='.env'; t=open(p).read()
          nuovi={
            'OFFERTA_BENVENUTO_TITOLO': '-15% su tutto fino al 30 novembre',
            'OFFERTA_BENVENUTO_TESTO': 'Lo sconto è già sulla tua tessera. Poi ogni settimana una nuova offerta, solo per chi ha la tessera e le notifiche attive: chi non le attiva se la perde.',
            'INVITO_NOTIFICHE_ATTIVO': 'true',
            'INVITO_NOTIFICHE_TITOLO': 'Attiva le notifiche',
            'INVITO_NOTIFICHE_TESTO': 'Ogni settimana una nuova offerta riservata a chi ha le notifiche attive. Attivale adesso: chi non le ha se la perde.',
          }
          for k,v in nuovi.items():
            riga=f'{k}={v}'
            if re.search(rf'^{k}=', t, re.M): t=re.sub(rf'^{k}=.*$', riga, t, flags=re.M)
            else: t=t.rstrip('\n')+'\n'+riga+'\n'
          open(p,'w').write(t)
          print('chiavi presenti:', [k for k in nuovi if re.search(rf'^{k}=', t, re.M)])
          PY
          cd /var/www/handmade-club && pm2 restart handmade-club --update-env >/dev/null && sleep 3
          echo "--- offerta servita ---"; curl -s http://127.0.0.1:3002/api/auth/offerta; echo
          echo "--- stato ---"; pm2 jlist | python3 -c "import json,sys; [print(p['name'],p['pm2_env']['status']) for p in json.load(sys.stdin) if p['name']=='handmade-club']"
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
