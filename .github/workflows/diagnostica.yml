name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Allinea la promo di apertura (lettura, aggiornamento, rilettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- promo prima ---"; Q "select id, stato, tipo, valore, titolo, coalesce(descrizione,''), valido_dal, valido_al, coalesce(codice_tgs,''), coalesce(immagine,'') <> '' as foto from promozioni order by id"
          N=$(Q "select count(*) from promozioni where stato <> 'archiviata'")
          if [ "$N" = "1" ]; then
            Q "update promozioni set titolo='Sconto 15% su tutto', descrizione='Benvenuto a Fiano! 15% di sconto su tutto quello che prendi, fino all''8 novembre 2026. Escluse bottiglie di vino e bollicine.', tipo='sconto_percentuale', valore=15, prodotto=null, valido_al='2026-11-08', updated_at=now() where stato <> 'archiviata'"
            echo "--- promo dopo ---"; Q "select id, stato, tipo, valore, titolo, coalesce(descrizione,''), valido_dal, valido_al from promozioni order by id"
          else
            echo "ATTENZIONE: trovate $N promo non archiviate, non tocco nulla"
          fi
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
