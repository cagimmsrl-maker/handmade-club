name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Accende il codice di rinnovo (modifica .env con copia di sicurezza)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          cd /var/www/handmade-club/server
          cp -p .env ".env.bak_$(date +%F_%H%M%S)"
          sed -i '/^CODICE_RINNOVO=/d;/^CODICE_RINNOVO_FINO_AL=/d' .env
          printf '\nCODICE_RINNOVO=147852\nCODICE_RINNOVO_FINO_AL=2026-12-31\n' >> .env
          echo "righe CODICE_RINNOVO nel .env: $(grep -c '^CODICE_RINNOVO' .env)"
          pm2 restart handmade-club --update-env >/dev/null
          sleep 3
          echo "salute: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/api/salute)"
          echo "codice sbagliato su numero inesistente -> $(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3002/api/auth/verifica-otp -H 'Content-Type: application/json' -d '{"telefono":"3000000000","codice":"000000"}')"
          pm2 logs handmade-club --lines 15 --nostream 2>/dev/null | grep -iE "error|ascolto" | tail -3 | sed -E 's/[0-9]{6,}/######/g'
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
