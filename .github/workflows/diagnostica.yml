name: Diagnostica rete (solo lettura)

# Lanciata a mano: verifica se un host risponde, prima da Internet (runner
# GitHub) e poi dal nostro server. Non modifica nulla sul server.
on:
  push:
    branches: [diagnostica-rete]

env:
  HOST: '5.154.199.20'
  PORTE: '9443 8443'

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Da Internet (runner GitHub)
        run: |
          for p in $PORTE; do
            if timeout 5 bash -c "</dev/tcp/$HOST/$p" 2>/dev/null; then echo "runner -> porta $p: APERTA"; else echo "runner -> porta $p: chiusa/filtrata"; fi
          done
          echo "--- chi risponde su 8443 (HTTPS)"
          curl -skv -m 8 -o /dev/null "https://$HOST:9443/" 2>&1 | grep -iE "subject:|issuer:|^< server|^< HTTP|^< location|^< www-authenticate|realm" || true
          echo "--- corpo (prime righe)"
          curl -sk -m 8 "https://$HOST:9443/" 2>/dev/null | tr -d '\r' | grep -ioE "<title>[^<]*</title>|realm=\"[^\"]*\"|tgs|mikrotik|fritz|zyxel|tp-link|huawei|cisco|draytek|ubiquiti|teltonika|iis|apache|nginx" | sort -u | head -10 || true

      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Dal nostro server
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "H=$HOST; for p in $PORTE; do if timeout 5 bash -c \"</dev/tcp/\$H/\$p\" 2>/dev/null; then echo \"server -> porta \$p: APERTA\"; else echo \"server -> porta \$p: chiusa/filtrata\"; fi; done; ping -c 2 -W 2 \$H 2>&1 | tail -2"
