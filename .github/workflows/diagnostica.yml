name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Attivita TGS sul server (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- chiavi: ultimo uso ---"; Q "select s.nome, k.attiva, coalesce(to_char(k.ultimo_uso_il at time zone 'Europe/Rome','DD/MM HH24:MI:SS'),'mai') from tgs_chiavi_api k join sedi s on s.id=k.sede_id"
          echo "--- esiti clienti per stato ---"; Q "select s.nome, x.stato, count(*) from tgs_sincronizzazioni x join sedi s on s.id=x.sede_id group by 1,2"
          echo "--- clienti attivi / in attesa ---"; Q "select count(*) filter (where c.stato='attivo') as attivi, count(*) filter (where c.stato='attivo' and not exists (select 1 from tgs_sincronizzazioni x where x.cliente_id=c.id)) as in_attesa from clienti c"
          echo "--- richieste /api/tgs (tutti i log nginx, ultime 15) ---"; grep -h "/api/tgs/" /var/log/nginx/*access*.log 2>/dev/null | tail -15 | sed -E 's/^([0-9.]+) .*\[([^]]+)\] "([A-Z]+) ([^ ]+)[^"]*" ([0-9]+).*/\2  \3 \4 -> \5  da \1/' || true
          echo "--- totale richieste /api/tgs ---"; cat /var/log/nginx/*access*.log 2>/dev/null | grep -c "/api/tgs/" || echo 0
          echo "--- errori app recenti ---"; pm2 logs handmade-club --err --lines 5 --nostream 2>/dev/null | grep -v "^\s*$" | tail -5 || true
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
