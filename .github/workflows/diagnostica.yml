name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prova porte pubbliche Fiano dal VPS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          for p in 9443 9010 8443 443 80 3389 1194 51820; do
            if timeout 4 bash -c "exec 3<>/dev/tcp/5.154.199.20/$p" 2>/dev/null; then echo "porta $p: APERTA"; else echo "porta $p: chiusa/filtrata"; fi
          done
          echo "--- risposta HTTP su 9443 ---"; curl -sk -m 6 -o /dev/null -w "HTTP %{http_code}\n" https://5.154.199.20:9443/ 2>&1 | head -2
          echo "--- intestazioni 8443 ---"; curl -sk -m 6 -I https://5.154.199.20:8443/ 2>&1 | head -3
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
