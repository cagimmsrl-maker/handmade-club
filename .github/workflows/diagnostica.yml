name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sconti - convenzioni, livelli e promo (sola lettura, nessun dato personale)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          sudo -u postgres psql -d handmade_clienti -At -F ' | ' <<'SQL'
          \echo === LIVELLI: nome | soglia | sconto | attivo ===
          SELECT nome, soglia_visite, sconto_percentuale, attivo FROM livelli ORDER BY ordine;
          \echo === CONVENZIONI: id | nome | sconto | attiva | clienti attivi ===
          SELECT v.id, v.nome, v.sconto_percentuale, v.attiva, (SELECT COUNT(*) FROM clienti c WHERE c.convenzione_id=v.id AND c.stato='attivo') FROM convenzioni v ORDER BY v.id;
          \echo === PROMO: id | titolo | tipo | valore | stato | dal | al | automatica | codice_tgs | usi/cliente | caricate ===
          SELECT p.id, p.titolo, p.tipo, p.valore, p.stato, p.valido_dal, p.valido_al, p.automatica, COALESCE(p.codice_tgs,'-'), COALESCE(p.usi_per_cliente::text,'illimitati'), (SELECT COUNT(*) FROM promozioni_clienti pc WHERE pc.promozione_id=p.id) FROM promozioni p ORDER BY p.id;
          \echo === CLIENTI CON CONVENZIONE CHE HANNO ANCHE UNA PROMO SCONTO CARICATA: convenzione | promo | clienti ===
          SELECT v.nome, p.titolo, COUNT(*) FROM clienti c JOIN convenzioni v ON v.id=c.convenzione_id JOIN promozioni_clienti pc ON pc.cliente_id=c.id JOIN promozioni p ON p.id=pc.promozione_id AND p.stato='pubblicata' AND p.valido_al >= current_date WHERE c.stato='attivo' GROUP BY 1,2;
          \echo === PROMO MANDATE ALLA CASSA TGS: promo | esito | n ===
          SELECT p.titolo, s.stato, COUNT(*) FROM tgs_sinc_promozioni s JOIN promozioni_clienti pc ON pc.id=s.promozione_cliente_id JOIN promozioni p ON p.id=pc.promozione_id GROUP BY 1,2;
          SQL
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
