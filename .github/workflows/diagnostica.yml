name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato consegna SMS Skebby dal 31/10 (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          cd /var/www/handmade-club/server || exit 1
          cat > _skebby-stato.js <<'JS'
          const BASE = 'https://api.skebby.it/API/v1.0/REST';
          const m = (n) => String(n || '').replace(/^(\+?\d{2,4})\d+(\d{3})$/, '$1…$2');
          (async () => {
            const r = await fetch(`${BASE}/login?username=${encodeURIComponent(process.env.SKEBBY_USER)}&password=${encodeURIComponent(process.env.SKEBBY_PASSWORD)}`);
            const [user_key, Session_key] = (await r.text()).trim().split(';');
            const h = { user_key, Session_key };
            const st = await (await fetch(`${BASE}/status?getMoney=true`, { headers: h })).json().catch(() => ({}));
            console.log('credito:', st.money);
            const hist = await (await fetch(`${BASE}/smshistory?from=20261031000000&pageSize=100`, { headers: h })).json().catch(() => ({}));
            const lista = hist.smshistory || [];
            console.log('SMS dal 31/10:', lista.length);
            for (const o of lista) {
              const d = await (await fetch(`${BASE}/sms/${o.order_id}`, { headers: h })).json().catch(() => ({}));
              const rec = (d.recipients || []).map(x => `${m(x.destination)} ${x.status}${x.delivery_date ? ' ' + x.delivery_date : ''}`).join('; ');
              console.log(`${o.schedule_time || o.send_date || ''} tipo=${o.message_type} mittente=${o.sender || '(numero)'} → ${rec}`);
            }
          })().catch(e => console.log('errore:', e.message));
          JS
          node --env-file=.env _skebby-stato.js; rm -f _skebby-stato.js
          echo "--- OTP di oggi ---"; sudo -u postgres psql -d handmade_clienti -Atc "select to_char(created_at at time zone 'Europe/Rome','HH24:MI'), tentativi, usato from otp_codes where created_at >= '2026-11-03 00:00+01' order by id"
          echo "--- log SMS oggi ---"; pm2 logs handmade-club --lines 200 --nostream 2>/dev/null | grep "\[SMS" | tail -5
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
