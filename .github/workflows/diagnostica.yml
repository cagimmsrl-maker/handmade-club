name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sedi attive e stato chiavi TGS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- sedi ---";        Q "select id, nome, attiva from sedi order by id"
          echo "--- chiavi TGS ---";  Q "select k.id, s.nome, k.etichetta, k.attiva, k.ultimo_uso_il from tgs_chiavi_api k join sedi s on s.id=k.sede_id order by k.id"
          echo "--- clienti ---";     Q "select stato, count(*) from clienti group by stato"
          echo "--- tessere attive ---"; Q "select count(*) from tessere where stato='attiva'"
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
