name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Togli il mittente alfanumerico Skebby (2) e riavvia
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          cd /var/www/handmade-club/server || exit 1
          ls .env.bak-* | tail -1
          python3 - <<'PY'
          import re, datetime
          s = open('.env').read()
          nota = "# SKEBBY_SENDER disattivato il %s: alias 'HandmadeCl' non registrato, molti operatori scartavano gli SMS (TIMEOUT su Skebby). Riattivare solo dopo l'approvazione dell'alias su Skebby.\n" % datetime.date.today().strftime('%d/%m/%Y')
          s2, n = re.subn(r'^SKEBBY_SENDER=.*$', nota + 'SKEBBY_SENDER=', s, flags=re.M)
          open('.env', 'w').write(s2)
          print('righe sostituite:', n)
          PY
          grep -n 'SKEBBY_SENDER' .env
          pm2 restart handmade-club --update-env >/dev/null && sleep 3 && pm2 describe handmade-club | grep -E "status" | head -1
          node --env-file=.env -e "console.log('sender visto dal processo:', JSON.stringify(process.env.SKEBBY_SENDER || ''))"
          pm2 logs handmade-club --lines 3 --nostream 2>/dev/null | tail -2
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
