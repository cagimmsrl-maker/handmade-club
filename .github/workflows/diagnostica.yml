name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato consegna SMS su Skebby (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          cat > /tmp/skebby-stato.js <<'JS'
          require('dotenv').config({ path: '/var/www/handmade-club/server/.env' });
          const BASE = 'https://api.skebby.it/API/v1.0/REST';
          const m = (n) => String(n || '').replace(/^(\+?\d{2,4})\d+(\d{3})$/, '$1…$2');
          (async () => {
            console.log('config: message_type=' + (process.env.SKEBBY_MESSAGE_TYPE || 'GP (default)') + ' sender=' + (process.env.SKEBBY_SENDER || '(nessuno: numero Skebby)'));
            const r = await fetch(`${BASE}/login?username=${encodeURIComponent(process.env.SKEBBY_USER)}&password=${encodeURIComponent(process.env.SKEBBY_PASSWORD)}`);
            if (!r.ok) { console.log('login HTTP ' + r.status); return; }
            const [user_key, Session_key] = (await r.text()).trim().split(';');
            const h = { user_key, Session_key };
            const st = await (await fetch(`${BASE}/status?getMoney=true&typeAliases=true`, { headers: h })).json().catch(() => ({}));
            console.log('credito:', JSON.stringify({ money: st.money, sms: st.sms }));
            const hist = await (await fetch(`${BASE}/smshistory?from=20261027000000&pageSize=100`, { headers: h })).json().catch(() => ({}));
            const lista = hist.smshistory || [];
            console.log('SMS inviati dal 27/10:', lista.length);
            for (const o of lista) {
              const d = await (await fetch(`${BASE}/sms/${o.order_id}`, { headers: h })).json().catch(() => ({}));
              const rec = (d.recipients || []).map(x => `${m(x.destination)} ${x.status}${x.delivery_date ? ' ' + x.delivery_date : ''}`).join('; ');
              console.log(`${o.schedule_time || o.send_date || ''} tipo=${o.message_type} mittente=${o.sender || '-'} → ${rec || JSON.stringify(d).slice(0, 120)}`);
            }
          })().catch(e => console.log('errore:', e.message));
          JS
          cd /var/www/handmade-club/server && node /tmp/skebby-stato.js; rm -f /tmp/skebby-stato.js
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
