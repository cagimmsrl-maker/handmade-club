name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato sincronizzazione TGS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- ora server ---"; date '+%d/%m %H:%M:%S'
          echo "--- chiave TGS: ultimo uso ---"; Q "select etichetta, attiva, to_char(ultimo_uso_il at time zone 'Europe/Rome','DD/MM HH24:MI:SS'), round(extract(epoch from now()-ultimo_uso_il))::int as secondi_fa from tgs_chiavi_api"
          echo "--- esiti per stato ---"; Q "select stato, count(*) from tgs_sincronizzazioni where sede_id=3 group by 1"
          echo "--- in attesa (attivi con tessera senza esito Fiano) ---"; Q "select c.id, to_char(c.created_at at time zone 'Europe/Rome','DD/MM HH24:MI') from clienti c join tessere t on t.cliente_id=c.id and t.stato='attiva' where c.stato='attivo' and not exists (select 1 from tgs_sincronizzazioni s where s.cliente_id=c.id and s.sede_id=3) order by c.id"
          echo "--- errori TGS ---"; Q "select cliente_id, messaggio, to_char(ultimo_esito_il at time zone 'Europe/Rome','DD/MM HH24:MI') from tgs_sincronizzazioni where stato='errore' order by ultimo_esito_il desc limit 10"
          echo "--- ritardo registrazione→esito (ultimi 25) ---"; Q "select c.id, to_char(c.created_at at time zone 'Europe/Rome','DD/MM HH24:MI') as iscritto, to_char(s.primo_esito_il at time zone 'Europe/Rome','DD/MM HH24:MI') as esito, round(extract(epoch from s.primo_esito_il-c.created_at)/60)::int as minuti, s.stato from clienti c join tgs_sincronizzazioni s on s.cliente_id=c.id and s.sede_id=3 order by c.id desc limit 25"
          echo "--- iscritti per giorno ---"; Q "select (created_at at time zone 'Europe/Rome')::date, count(*) from clienti where created_at >= '2026-10-31 00:00+01' group by 1 order by 1"
          echo "--- chiamate TGS per ora oggi e ieri (nginx) ---"; sudo zcat -f /var/log/nginx/club.handmadecafe.it.access.log* 2>/dev/null | grep -E '/api/tgs/' | awk '{print substr($4,2,14)}' | sort | uniq -c | tail -40 || echo "(log nginx non trovato con quel nome)"; ls /var/log/nginx/ | head -20
          echo "--- risposte non-2xx a TGS ---"; sudo zcat -f /var/log/nginx/*access*.log* 2>/dev/null | grep -E '/api/tgs/' | awk '$9 !~ /^2/ {print $4, $7, $9}' | tail -15
          echo "--- log app: righe tgs/errori ultime 300 ---"; pm2 logs handmade-club --lines 300 --nostream 2>/dev/null | grep -iE "tgs|error|errore" | grep -v "integrazione cassa spenta" | tail -15
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
