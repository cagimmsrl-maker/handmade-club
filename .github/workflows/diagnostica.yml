name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sessioni clienti - scadenze e 401 (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          echo "=== NGINX /api/cliente/me per giorno e codice (ultimi 4 giorni) ==="
          L=$(ls /var/log/nginx/*club*access*.log 2>/dev/null | head -1); [ -z "$L" ] && L=/var/log/nginx/access.log
          echo "log: $(basename $L)"
          for f in $L $L.1; do [ -f $f ] && cat $f; done | grep ' /api/cliente/me' | awk '{d=substr($4,2,11); print d, $9}' | sort | uniq -c | tail -12
          sudo -u postgres psql -d handmade_clienti -At -F ' | ' <<'SQL'
          \echo === TESSERE PER DATA DI CREAZIONE (fino al 28/10) - sessioni scadute se non rinnovate ===
          SELECT to_char(created_at AT TIME ZONE 'Europe/Rome','DD/MM'), COUNT(*) FROM clienti WHERE created_at < '2026-10-29 00:00+01' GROUP BY 1 ORDER BY 1;
          \echo === CLIENTI CON sessioni_valide_da IMPOSTATO ultimi 3 giorni ===
          SELECT COUNT(*) FROM clienti WHERE sessioni_valide_da >= now() - interval '3 days';
          \echo === TESSERE CHE SCADONO PER DATA (30 gg dalla creazione o ultimo login) prossimi 10 giorni ===
          SELECT to_char((created_at + interval '30 days') AT TIME ZONE 'Europe/Rome','DD/MM'), COUNT(*) FROM clienti WHERE stato='attivo' AND created_at + interval '30 days' < now() + interval '10 days' GROUP BY 1 ORDER BY 1;
          SQL
          echo "=== pm2 handmade-club: riavvii e uptime ==="
          pm2 jlist | python3 -c "import json,sys,time; [print(p['name'],'restarts',p['pm2_env']['restart_time'],'uptime_h',round((time.time()*1000-p['pm2_env']['pm_uptime'])/3600000,1)) for p in json.load(sys.stdin) if p['name']=='handmade-club']"
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
