name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Tessere e TGS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- ora ---"; date '+%d/%m %H:%M'
          echo "--- totale attivi / verificati ---"; Q "select count(*), count(*) filter (where telefono_verificato) from clienti where stato='attivo'"
          echo "--- iscritti per giorno dal 28/10 ---"; Q "select to_char(created_at at time zone 'Europe/Rome','DD/MM'), count(*) from clienti where created_at >= '2026-10-28 00:00+01' group by 1 order by min(created_at)"
          echo "--- oggi per ora ---"; Q "select to_char(created_at at time zone 'Europe/Rome','HH24'), count(*) from clienti where created_at >= '2026-11-06 00:00+01' group by 1 order by 1"
          echo "--- TGS: ultimo uso chiave ---"; Q "select to_char(ultimo_uso_il at time zone 'Europe/Rome','DD/MM HH24:MI:SS'), round(extract(epoch from now()-ultimo_uso_il))::int from tgs_chiavi_api where attiva"
          echo "--- TGS esiti ---"; Q "select stato, count(*) from tgs_sincronizzazioni where sede_id=3 group by 1"
          echo "--- in attesa TGS ---"; Q "select count(*) from clienti c join tessere t on t.cliente_id=c.id and t.stato='attiva' where c.stato='attivo' and not exists (select 1 from tgs_sincronizzazioni s where s.cliente_id=c.id and s.sede_id=3)"
          echo "--- errori TGS ---"; Q "select count(*) from tgs_sincronizzazioni where stato='errore'"
          echo "--- promo −15% caricamenti / usi ---"; Q "select (select count(*) from promozioni_clienti where promozione_id=3), (select count(*) from promozioni_utilizzi where promozione_id=3), (select count(*) from tgs_passaggi)"
          echo "--- OTP ieri e oggi (ora, tentativi, usato) ---"; Q "select to_char(created_at at time zone 'Europe/Rome','DD HH24:MI'), tentativi, usato from otp_codes where created_at >= '2026-11-05 00:00+01' order by id"
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
