name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Notifiche push - iscrizioni per giorno, tessere nuove e vecchie (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set -e
          cd /var/www/handmade-club/server
          echo "--- env invito (solo presenza) ---"; grep -c '^INVITO_NOTIFICHE_ATTIVO=true' .env || true
          echo "--- /cliente/me senza login (deve dare 401) ---"; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3002/api/cliente/me
          echo "--- versione frontend servita (InvitoNotifiche nel bundle) ---"; grep -l "invito-sfondo" /var/www/handmade-club/client/dist/assets/*.js | wc -l
          sudo -u postgres psql -d handmade_clienti -At -F ' | ' <<'SQL'
          \echo --- iscrizioni push per giorno (data iscrizione) ---
          SELECT to_char(created_at AT TIME ZONE 'Europe/Rome','YYYY-MM-DD') g, COUNT(*) FROM push_iscrizioni GROUP BY 1 ORDER BY 1;
          \echo --- iscrizioni dal 15/11 01:00: cliente nuovo (tessera creata dopo) o vecchio ---
          SELECT CASE WHEN c.created_at >= '2026-11-15 01:00+01' THEN 'tessera nuova' ELSE 'tessera vecchia' END, COUNT(*)
          FROM push_iscrizioni p JOIN clienti c ON c.id=p.cliente_id WHERE p.created_at >= '2026-11-15 01:00+01' GROUP BY 1;
          \echo --- tessere nuove dal 15/11 01:00 e quante con push ---
          SELECT COUNT(*), COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM push_iscrizioni p WHERE p.cliente_id=c.id)) FROM clienti c WHERE c.created_at >= '2026-11-15 01:00+01' AND c.stato='attivo';
          \echo --- consensi marketing dati dal 15/11 01:00 (anche da vecchi) ---
          SELECT COUNT(*) FROM clienti WHERE consenso_marketing_il >= '2026-11-15 01:00+01';
          \echo --- totale telefoni iscritti / clienti ---
          SELECT COUNT(*), COUNT(DISTINCT cliente_id) FROM push_iscrizioni;
          \echo --- passaggi in cassa oggi (tessere usate) ---
          SELECT COUNT(*) FROM scansioni WHERE created_at >= '2026-11-15 00:00+01';
          \echo --- user agent delle tessere nuove senza push (ultimi 15, solo browser) ---
          SELECT COALESCE(substring(s.ua from '(iPhone|Android [0-9]+|SamsungBrowser|Instagram|FBAN|CriOS|Chrome/[0-9]+|Safari)'),'?') , COUNT(*) FROM (
            SELECT (SELECT user_agent FROM push_iscrizioni WHERE cliente_id=c.id LIMIT 1) ua FROM clienti c WHERE c.created_at >= '2026-11-15 01:00+01') s GROUP BY 1;
          SQL
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
