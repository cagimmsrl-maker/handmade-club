name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato SMS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          L=/root/.pm2/logs
          echo "--- SMS per giorno (inviati / errori) ---"
          for f in $L/handmade-club-out.log $L/handmade-club-error.log; do [ -f "$f" ] && grep -h "\[SMS" "$f"; done | grep -E "2026-10-(2[6-9]|3[01])" | awk '{d=substr($1,1,10); if ($0 ~ /inviato/) ok[d]++; else if ($0 ~ /errore/) ko[d]++; else alt[d]++} END {for (d in ok) print d, "inviati:", ok[d], "errori:", ko[d]+0, "altro:", alt[d]+0}' | sort
          echo "--- ultimi 8 messaggi SMS (numeri mascherati) ---"
          for f in $L/handmade-club-out.log $L/handmade-club-error.log; do [ -f "$f" ] && grep -h "\[SMS" "$f"; done | tail -8
          echo "--- ultimi errori Skebby ---"
          grep -h "SMS skebby\] errore" $L/handmade-club-*.log 2>/dev/null | tail -5
          echo "--- OTP richiesti/verificati dal 28/10 (DB) ---"
          Q "select column_name from information_schema.columns where table_name='otp_codici'" | tr '\n' ' '; echo
          Q "select (created_at at time zone 'Europe/Rome')::date g, count(*) richiesti, count(*) filter (where usato_il is not null) verificati from otp_codici where created_at >= '2026-10-28 00:00+01' group by 1 order by 1" 2>&1
          echo "--- verificati per giorno di registrazione ---"
          Q "select (created_at at time zone 'Europe/Rome')::date g, count(*) iscritti, count(*) filter (where telefono_verificato) verificati from clienti where created_at >= '2026-10-28 00:00+01' group by 1 order by 1"
          echo "--- provider configurato ---"; grep -o '^SMS_PROVIDER=.*' /root/handmade-club/server/.env 2>/dev/null || grep -rho '^SMS_PROVIDER=.*' /root/*/server/.env 2>/dev/null
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
