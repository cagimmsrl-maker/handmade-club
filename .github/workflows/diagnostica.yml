name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stato SMS (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- file di log pm2 ---"; ls -la ~/.pm2/logs/ | grep handmade
          echo "--- ultime 20 righe SMS (pm2 logs con ora) ---"
          pm2 logs handmade-club --lines 3000 --nostream --timestamp "YYYY-MM-DD HH:mm" 2>/dev/null | grep "\[SMS" | tail -20
          echo "--- OTP per giorno: richiesti / usati / con tentativi ---"
          Q "select (created_at at time zone 'Europe/Rome')::date g, count(*) richiesti, count(*) filter (where usato) usati, count(*) filter (where tentativi>0) con_tentativi from otp_codes where created_at >= '2026-10-27 00:00+01' group by 1 order by 1"
          echo "--- ultimi 12 OTP (ora, tentativi, usato) ---"
          Q "select to_char(created_at at time zone 'Europe/Rome','DD/MM HH24:MI'), tentativi, usato from otp_codes order by id desc limit 12"
          exit 0
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
