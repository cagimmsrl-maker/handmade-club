name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Conteggio iscrizioni (sola lettura)
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- totale attivi ---"; Q "select count(*) from clienti where stato='attivo'"
          echo "--- per giorno dal 27/10 ---"; Q "select (created_at at time zone 'Europe/Rome')::date as g, count(*) from clienti where created_at >= '2026-10-27 00:00+01' group by 1 order by 1"
          echo "--- per ora ieri e oggi ---"; Q "select to_char(created_at at time zone 'Europe/Rome','DD/MM HH24') as h, count(*) from clienti where created_at >= '2026-10-29 00:00+01' group by 1 order by 1"
          echo "--- TGS ---"; Q "select stato, count(*) from tgs_sincronizzazioni where sede_id=3 group by 1"
          echo "--- in attesa TGS ---"; Q "select count(*) from clienti c join tessere t on t.cliente_id=c.id and t.stato='attiva' where c.stato='attivo' and not exists (select 1 from tgs_sincronizzazioni s where s.cliente_id=c.id and s.sede_id=3)"
          echo "--- passaggi cassa ---"; Q "select count(*) from tgs_passaggi"
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
