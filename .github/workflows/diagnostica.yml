name: Comando sul server (solo lettura salvo indicazione)

on:
  push:
    branches: [diagnostica-rete]

jobs:
  comando:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepara chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prolunga la promo -15% al 30/11 e avvisa in bacheca
        run: |
          cat > /tmp/cmd.sh <<'SCRIPT'
          set +e
          Q() { sudo -u postgres psql -d handmade_clienti -Atc "$1"; }
          echo "--- prima ---"; Q "select id, stato, tipo, valore, valido_al, automatica, titolo from promozioni where id=3"
          if [ "$(Q "select count(*) from promozioni where id=3 and stato='pubblicata' and valido_al='2026-11-08'")" = "1" ]; then
            sudo -u postgres psql -d handmade_clienti -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          UPDATE promozioni SET
            valido_al = '2026-11-30',
            titolo = 'Nuova apertura Fiano Romano: −15% per te, fino al 30 novembre',
            descrizione = 'Benvenuto a Fiano! Per festeggiare la nuova apertura, ai possessori della tessera Handmade Club il 15% di sconto su tutto quello che prendi, prolungato fino al 30 novembre 2026. Escluse bottiglie di vino e bollicine.',
            updated_at = now()
          WHERE id = 3;
          INSERT INTO promozioni (titolo, descrizione, tipo, valore, valido_dal, valido_al, target_sede_id, usi_per_cliente, stato, pubblicata_il, automatica)
          VALUES ('Buone notizie: la −15% è prolungata fino al 30 novembre',
                  'La promozione di apertura di Fiano Romano continua: 15% di sconto su tutto per chi ha la tessera Handmade Club, fino al 30 novembre 2026. Mostra la tessera in cassa. Escluse bottiglie di vino e bollicine.',
                  'messaggio', NULL, '2026-11-08', '2026-11-30', 3, NULL, 'pubblicata', now(), true);
          INSERT INTO promozioni_clienti (promozione_id, cliente_id)
          SELECT p.id, c.id FROM promozioni p
            JOIN clienti c ON c.stato = 'attivo'
            JOIN tessere t ON t.cliente_id = c.id AND t.stato = 'attiva'
           WHERE p.automatica = true AND p.stato = 'pubblicata'
          ON CONFLICT (promozione_id, cliente_id) DO NOTHING;
          COMMIT;
          SQL
            echo "--- dopo ---"; Q "select id, stato, tipo, valido_al, automatica, titolo from promozioni where stato='pubblicata' order by id"
            echo "--- caricamenti ---"; Q "select promozione_id, count(*) from promozioni_clienti group by 1 order by 1"
          else
            echo "ATTENZIONE: promo 3 non nello stato atteso, non tocco nulla"
          fi
          echo "--- contatti con consenso marketing (per l'avviso) ---"; Q "select count(*) filter (where consenso_marketing_il is not null and consenso_marketing_revocato_il is null), count(*) from clienti where stato='attivo'" 2>&1
          SCRIPT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' < /tmp/cmd.sh
